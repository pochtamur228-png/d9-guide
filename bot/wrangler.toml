name = "d9-reminders"
main = "src/index.js"
compatibility_date = "2025-06-01"

# кому приходят идеи и баги от игроков (chat id владельца бота)
[vars]
OWNER_ID = "5738571352"

# раз в 5 минут — подарки, налоги, рассылка; 08:45/16:45 UTC — турниры, 12:45/16:45 UTC — AirDrop (за 15 мин, МСК = UTC+3)
[triggers]
crons = ["*/5 * * * *", "45 8 * * *", "45 12 * * *", "45 16 * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "70d5b34e1f534800a30bdc1be073bcb4"
